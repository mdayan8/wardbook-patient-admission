# Render blueprint: one web service (Docker) + a free Postgres. DATABASE_URL is wired automatically.
services:
  - type: web
    name: wardbook
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wardbook-db
          property: connectionString
databases:
  - name: wardbook-db
    plan: free
